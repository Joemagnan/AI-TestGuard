[project]
name = "ai-testguard"
version = "1.0.0"
description = "Qualification d'un modèle de détection de fraude bancaire (tests, robustesse, CI)"
requires-python = ">=3.12"
authors = [{ name = "Joe MAGNAN" }]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests longs (exécutés à la demande ou sur calendrier, pas à chaque PR)",
    "full_data: nécessite data/creditcard.csv (jeu Kaggle complet)",
]
filterwarnings = ["error::FutureWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/plots.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
