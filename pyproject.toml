[project]
name = "ai-testguard"
version = "1.0.0"
description = "Qualification d'un modèle de détection de fraude bancaire (tests, robustesse, CI)"
requires-python = ">=3.12"
authors = [{ name = "Joe MAGNAN" }]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# scripts de génération de rapports : longues chaînes formatées
"scripts/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# idiome FastAPI : File(...) dans la signature déclare le paramètre de requête
extend-immutable-calls = ["fastapi.File"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests longs (exécutés à la demande ou sur calendrier, pas à chaque PR)",
    "full_data: nécessite data/creditcard.csv (jeu Kaggle complet)",
]
filterwarnings = [
    "error::FutureWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
